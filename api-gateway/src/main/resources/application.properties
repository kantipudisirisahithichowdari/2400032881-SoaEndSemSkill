spring.application.name=api-gateway
server.port=8081

# Use the reactive WebFlux application type
spring.main.web-application-type=reactive

# Eureka discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

# Route requests through the gateway to the registered signup-service instances
spring.cloud.gateway.routes[0].id=signup-service
spring.cloud.gateway.routes[0].uri=lb://SIGNUP-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/signup/**

# Optional: expose discovered services as gateway routes
spring.cloud.gateway.discovery.locator.enabled=false
